name: 🐛 Bug Report | Bug Report
title: "🐛 Bug: Unexpected behavior"
description: Submit a bug report to help us improve the code
labels: ["bug"]
body:
  - type: dropdown
    id: env-os
    attributes:
      label: Operating System
      description: Select the operating system running AI Vtuber
      options:
        - Windows
        - MacOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: env-python-ver
    attributes:
      label: Python Version
      description: Enter the Python version used to run AI Vtuber
      placeholder: e.g. 3.10.11
    validations:
      required: true

  - type: input
    id: env-nb-ver
    attributes:
      label: AI Vtuber Version
      description: Enter the AI Vtuber version (date)
      placeholder: e.g. 20240510
    validations:
      required: true

  - type: textarea
    id: describe
    attributes:
      label: Describe the Problem
      description: Describe clearly and concisely what the problem is https://lug.ustc.edu.cn/wiki/doc/smart-questions
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps that reproduce this problem
      placeholder: |
        1. First...
        2. Then...
        3. Then it happens...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Describe clearly and concisely what you expected to happen

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Logs
      description: Provide any logs and screenshots that help diagnose the problem